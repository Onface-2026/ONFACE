<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnFace - Registo</title>
    
    <link rel="stylesheet"
href="cadastro.css">

</head>
<body>

    <div class="card">
        <div class="header">
            <h1>Cadastre-se</h1>
            <div class="logo-container">
                <img src="ONFACEorigbranco.png" alt="">
            </div>
        </div>

        <form>
            <div class="form-grid">
                <div class="input-group">
                    <label>Primeiro nome</label>
                    <input type="text" name="nome" placeholder="Digite seu primeiro nome">
                </div>
                <div class="input-group">
                    <label>Sobrenome</label>
                    <input type="text" name="sobrenome" placeholder="Digite seu sobrenome">
                </div>
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" name="e-mail" placeholder="Digite seu e-mail">
                </div>
                <div class="input-group">
                    <label>Celular</label>
                    <input type="text" name="celular" placeholder="(xx) xxxxx-xxxx">
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" name="senha" placeholder="Digite sua senha">
                </div>
                <div class="input-group">
                    <label>Confirmar senha</label>
                    <input type="password" name="senha-confirm" placeholder="Digite sua senha">
                </div>
            </div>

            <div class="footer">
                <button type="submit" class="btn-concluir"> <a href="login.html">Concluir cadastro</a></button>
            </div>
        </form>
    </div>

</body>
</html>
