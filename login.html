<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnFace - Login</title>

    <link rel="stylesheet"
href="login.css">
</head>
<body>

    <div class="main-card">
        <!-- Lado Esquerdo -->
        <div class="welcome-side">
            <div class="logo-area">
                <img src="ONFACEorigbranco.png" alt="">
            </div>
            <h1>Seja bem-vindo!</h1>
        </div>

        <!-- Lado Direito -->
        <div class="login-side">
            <div class="login-container">
                <h2>Login</h2>
                
                <div class="input-group">
                    <input type="text" placeholder="E-mail ou nome de usuário">
                </div>
                
                <div class="input-group">
                    <input type="password" placeholder="Senha">
                </div>

                <button class="btn-entrar"><a href="perfil.html" class="btn-entrar">Entrar</a></button>

                <div class="footer-links">
                    <p>Não possui conta? <a href="cadastro.html">Cadastre-se</a></p>
                    <p><a href="forgetpassword.html">Esqueci a senha</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
